name: Verificar la tienda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verificar:
    name: Probar la tienda y los verifica de cada lección
    runs-on: ubuntu-latest

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Node (para newman)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar lo que usan la tienda y sus pruebas
        run: |
          python -m pip install -r tienda/requisitos.txt httpx pytest
          python -m playwright install --with-deps chromium
          npm install -g --no-fund --no-audit newman@6.2.3
          sudo apt-get install -y jq

      - name: Decir con qué se va a verificar
        run: |
          python --version
          newman --version
          jq --version

      - name: Las pruebas de la tienda (ninguna puede saltarse)
        run: |
          python -m pytest pruebas -q -rs --junitxml=reporte.xml
          # Una prueba saltada se ve igual que una verde: si falta newman, jq o el navegador,
          # las de esas lecciones se saltan y el total sigue diciendo «passed». Aquí eso es rojo.
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          r = ET.parse("reporte.xml").getroot()
          s = r if r.tag == "testsuite" else r.find("testsuite")
          total, saltadas = int(s.get("tests", 0)), int(s.get("skipped", 0))
          print(f"pruebas: {total} · saltadas: {saltadas}")
          if total == 0:
              sys.exit("No corrió ninguna prueba: este paso no verificó nada.")
          if saltadas:
              sys.exit(f"{saltadas} prueba(s) se saltaron: falta alguna herramienta.")
          PY

      - name: Nota sobre la revisión previa a publicar
        run: |
          echo "La revisión de material no publicable (rutas internas, nombres reservados,"
          echo "direcciones de la infraestructura) se corre ANTES de publicar, con la lista"
          echo "de patrones que vive en el repositorio de trabajo y no se publica."
